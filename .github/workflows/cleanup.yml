name: cleanup
# Daily: delete Actions artifacts older than 3 days and caches unused for 3 days.
# Release assets are not touched.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts and unused caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cut=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cut\") | .id" |
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" --silent || true; done
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.last_accessed_at < \"$cut\") | .id" |
          while read -r id; do gh api -X DELETE "repos/$REPO/actions/caches/$id" --silent || true; done
